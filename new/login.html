<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - REN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        secondary: '#0f172a',
                        accent: '#8b5cf6',
                    },
                    borderRadius: {
                        '4xl': '2rem',
                        '5xl': '2.5rem',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .hero-pattern { background-image: radial-gradient(#e2e8f0 1px, transparent 1px); background-size: 32px 32px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 selection:bg-primary/10 selection:text-primary min-h-screen flex flex-col">

    <!-- Simple Navigation -->
    <nav class="p-8">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="index.html" class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-gradient-to-br from-primary to-accent rounded-xl flex items-center justify-center text-white shadow-lg">
                    <i class="fa-solid fa-r text-xl font-black"></i>
                </div>
                <span class="text-2xl font-extrabold tracking-tighter">REN</span>
            </a>
            <a href="index.html" class="text-sm font-bold text-slate-500 hover:text-primary transition flex items-center">
                <i class="fa-solid fa-arrow-left mr-2"></i> Back to home
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center px-6 py-20 hero-pattern">
        <div class="max-w-md w-full">
            <div class="bg-white rounded-[3.5rem] shadow-2xl shadow-blue-100 p-10 lg:p-16 border border-slate-100 relative overflow-hidden">
                <!-- Decorative background blob -->
                <div class="absolute -top-20 -right-20 w-40 h-40 bg-primary/5 rounded-full blur-3xl"></div>

                <div class="relative z-10">
                    <div class="text-center mb-12">
                        <h1 class="text-3xl font-black text-secondary mb-3">Welcome back.</h1>
                        <p class="text-slate-400 font-bold text-sm uppercase tracking-widest">Sign in to your account</p>
                    </div>

                    <form class="space-y-8">
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-3 ml-2">Email Address</label>
                            <div class="relative group">
                                <i class="fa-regular fa-envelope absolute left-5 top-1/2 -translate-y-1/2 text-slate-300 group-focus-within:text-primary transition"></i>
                                <input type="email" required class="w-full pl-14 pr-6 py-4 rounded-2xl bg-slate-50 border border-slate-100 focus:bg-white focus:border-primary/30 outline-none transition-all font-medium" placeholder="name@company.com">
                            </div>
                        </div>

                        <div>
                            <div class="flex items-center justify-between mb-3 ml-2">
                                <label class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">Password</label>
                                <a href="#" class="text-[10px] font-black text-primary uppercase tracking-[0.2em] hover:underline">Forgot?</a>
                            </div>
                            <div class="relative group">
                                <i class="fa-solid fa-lock absolute left-5 top-1/2 -translate-y-1/2 text-slate-300 group-focus-within:text-primary transition"></i>
                                <input type="password" required class="w-full pl-14 pr-6 py-4 rounded-2xl bg-slate-50 border border-slate-100 focus:bg-white focus:border-primary/30 outline-none transition-all font-medium" placeholder="••••••••">
                            </div>
                        </div>

                        <div class="flex items-center ml-2">
                            <input type="checkbox" id="remember" class="w-4 h-4 rounded border-slate-200 text-primary focus:ring-primary/20 cursor-pointer">
                            <label for="remember" class="ml-3 text-xs font-bold text-slate-500 cursor-pointer">Stay signed in for 30 days</label>
                        </div>

                        <button type="submit" class="w-full py-5 bg-primary text-white rounded-2xl font-black text-lg hover:bg-blue-700 transition shadow-xl shadow-primary/30">
                            Sign In
                        </button>
                    </form>

                    <div class="mt-12 pt-8 border-t border-slate-50 text-center">
                        <p class="text-sm font-bold text-slate-400">New to the network? <a href="register.html" class="text-primary hover:underline">Join now</a></p>
                    </div>
                </div>
            </div>
            
            <p class="mt-12 text-center text-[10px] font-black text-slate-300 uppercase tracking-[0.3em]">
                &copy; 2026 Rangpur Entrepreneurs Network
            </p>
        </div>
    </main>

</body>
</html>
