<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - REN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        secondary: '#0f172a',
                        accent: '#8b5cf6',
                    },
                    borderRadius: {
                        '4xl': '2rem',
                        '5xl': '2.5rem',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 selection:bg-primary/10 selection:text-primary min-h-screen flex flex-col">

    <!-- Simple Navigation -->
    <nav class="p-8 bg-white border-b border-slate-100">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="index.html" class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-gradient-to-br from-primary to-accent rounded-xl flex items-center justify-center text-white shadow-lg">
                    <i class="fa-solid fa-r text-xl font-black"></i>
                </div>
                <span class="text-2xl font-extrabold tracking-tighter">REN</span>
            </a>
            
            <div class="hidden sm:flex items-center space-x-4 text-[10px] font-black uppercase tracking-[0.2em] text-slate-300">
                <span class="text-primary">Cart</span>
                <i class="fa-solid fa-chevron-right text-[8px]"></i>
                <span class="text-secondary">Checkout</span>
                <i class="fa-solid fa-chevron-right text-[8px]"></i>
                <span>Success</span>
            </div>

            <a href="cart.html" class="text-sm font-bold text-slate-500 hover:text-primary transition">Return to Cart</a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow px-6 py-16 lg:py-24">
        <div class="max-w-7xl mx-auto">
            <div class="grid lg:grid-cols-3 gap-16 items-start">
                
                <!-- Forms Column -->
                <div class="lg:col-span-2 space-y-12">
                    
                    <!-- Section 1: Shipping -->
                    <div class="bg-white p-10 lg:p-14 rounded-[3.5rem] border border-slate-100 shadow-sm">
                        <div class="flex items-center space-x-4 mb-10">
                            <div class="w-10 h-10 bg-blue-50 text-primary rounded-2xl flex items-center justify-center font-black text-sm">1</div>
                            <h2 class="text-2xl font-black text-secondary">Shipping Information</h2>
                        </div>

                        <div class="grid sm:grid-cols-2 gap-8">
                            <div class="sm:col-span-2">
                                <label class="block text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-3 ml-2">Full Name</label>
                                <input type="text" required class="w-full px-6 py-4 rounded-2xl bg-slate-50 border border-slate-100 focus:bg-white focus:border-primary/30 outline-none transition-all font-medium" placeholder="John Doe">
                            </div>
                            <div>
                                <label class="block text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-3 ml-2">Phone Number</label>
                                <input type="tel" required class="w-full px-6 py-4 rounded-2xl bg-slate-50 border border-slate-100 focus:bg-white focus:border-primary/30 outline-none transition-all font-medium" placeholder="+880">
                            </div>
                            <div>
                                <label class="block text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-3 ml-2">Email Address</label>
                                <input type="email" required class="w-full px-6 py-4 rounded-2xl bg-slate-50 border border-slate-100 focus:bg-white focus:border-primary/30 outline-none transition-all font-medium" placeholder="name@example.com">
                            </div>
                            <div class="sm:col-span-2">
                                <label class="block text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-3 ml-2">Delivery Address</label>
                                <textarea rows="3" required class="w-full px-6 py-4 rounded-2xl bg-slate-50 border border-slate-100 focus:bg-white focus:border-primary/30 outline-none transition-all font-medium" placeholder="House no, Street, Area..."></textarea>
                            </div>
                            <div class="sm:col-span-2">
                                <label class="block text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-3 ml-2">District</label>
                                <select class="w-full px-6 py-4 rounded-2xl bg-slate-50 border border-slate-100 focus:bg-white focus:border-primary/30 outline-none transition-all font-medium appearance-none cursor-pointer">
                                    <option>Rangpur</option>
                                    <option>Dinajpur</option>
                                    <option>Gaibandha</option>
                                    <option>Kurigram</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Section 2: Payment -->
                    <div class="bg-white p-10 lg:p-14 rounded-[3.5rem] border border-slate-100 shadow-sm">
                        <div class="flex items-center space-x-4 mb-10">
                            <div class="w-10 h-10 bg-violet-50 text-accent rounded-2xl flex items-center justify-center font-black text-sm">2</div>
                            <h2 class="text-2xl font-black text-secondary">Payment Method</h2>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
                            <label class="cursor-pointer group">
                                <input type="radio" name="payment" class="peer sr-only" checked>
                                <div class="p-8 rounded-[2rem] border-2 border-slate-50 bg-slate-50 text-center peer-checked:border-primary peer-checked:bg-blue-50/50 transition-all">
                                    <div class="h-10 flex items-center justify-center mb-4">
                                        <span class="font-black text-xl text-[#d12053]">bKash</span>
                                    </div>
                                    <p class="text-[10px] font-black uppercase tracking-widest text-slate-400">Mobile Banking</p>
                                </div>
                            </label>
                            <label class="cursor-pointer group">
                                <input type="radio" name="payment" class="peer sr-only">
                                <div class="p-8 rounded-[2rem] border-2 border-slate-50 bg-slate-50 text-center peer-checked:border-primary peer-checked:bg-blue-50/50 transition-all">
                                    <div class="h-10 flex items-center justify-center mb-4 text-[#f06322] font-black text-xl italic">
                                        Nagad
                                    </div>
                                    <p class="text-[10px] font-black uppercase tracking-widest text-slate-400">Mobile Banking</p>
                                </div>
                            </label>
                            <label class="cursor-pointer group">
                                <input type="radio" name="payment" class="peer sr-only">
                                <div class="p-8 rounded-[2rem] border-2 border-slate-50 bg-slate-50 text-center peer-checked:border-primary peer-checked:bg-blue-50/50 transition-all">
                                    <div class="h-10 flex items-center justify-center mb-4">
                                        <i class="fa-solid fa-hand-holding-dollar text-3xl text-slate-300 group-hover:text-primary transition"></i>
                                    </div>
                                    <p class="text-[10px] font-black uppercase tracking-widest text-slate-400">Cash on Delivery</p>
                                </div>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Summary Column -->
                <div class="lg:col-span-1">
                    <div class="bg-secondary rounded-[3.5rem] p-10 lg:p-12 text-white shadow-2xl sticky top-12">
                        <h2 class="text-xl font-black mb-10">Review Order</h2>
                        
                        <div class="space-y-6 mb-10 overflow-y-auto max-h-80 pr-2 custom-scrollbar">
                            <!-- Item 1 -->
                            <div class="flex items-center space-x-6 pb-6 border-b border-white/5">
                                <div class="w-16 h-16 rounded-2xl overflow-hidden flex-shrink-0 bg-white/5">
                                    <img src="https://images.unsplash.com/photo-1590736962234-45520970677a?ixlib=rb-1.2.1&auto=format&fit=crop&w=100&q=80" class="w-full h-full object-cover" alt="">
                                </div>
                                <div class="flex-grow">
                                    <h4 class="text-sm font-bold line-clamp-1">Silk Sari</h4>
                                    <p class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Qty: 1</p>
                                </div>
                                <span class="text-sm font-black tracking-tighter">৳4.5K</span>
                            </div>
                            <!-- Item 2 -->
                            <div class="flex items-center space-x-6 pb-6 border-b border-white/5">
                                <div class="w-16 h-16 rounded-2xl overflow-hidden flex-shrink-0 bg-white/5">
                                    <img src="https://images.unsplash.com/photo-1595122245592-4545362a7467?ixlib=rb-1.2.1&auto=format&fit=crop&w=100&q=80" class="w-full h-full object-cover" alt="">
                                </div>
                                <div class="flex-grow">
                                    <h4 class="text-sm font-bold line-clamp-1">Organic Honey</h4>
                                    <p class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Qty: 2</p>
                                </div>
                                <span class="text-sm font-black tracking-tighter">৳1.7K</span>
                            </div>
                        </div>

                        <div class="space-y-4 mb-10 pb-10 border-b border-white/5">
                            <div class="flex justify-between text-xs font-bold text-slate-500">
                                <span class="uppercase tracking-widest">Subtotal</span>
                                <span>৳6,200</span>
                            </div>
                            <div class="flex justify-between text-xs font-bold text-slate-500">
                                <span class="uppercase tracking-widest">Delivery</span>
                                <span>৳100</span>
                            </div>
                        </div>

                        <div class="flex justify-between items-center mb-10">
                            <span class="text-sm font-black uppercase tracking-widest">Total</span>
                            <span class="text-3xl font-black text-primary tracking-tighter">৳6,300</span>
                        </div>

                        <button class="w-full py-5 bg-primary text-white rounded-2xl font-black text-lg hover:bg-blue-700 transition shadow-xl shadow-primary/20">
                            Confirm & Pay
                        </button>
                        <p class="mt-8 text-center text-[8px] font-black text-slate-600 uppercase tracking-[0.2em]">
                            <i class="fa-solid fa-shield-check mr-2 text-primary"></i> Secure REN Checkout
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="p-12 text-center mt-auto border-t border-slate-100 bg-white">
        <p class="text-[10px] font-black text-slate-300 uppercase tracking-[0.3em]">&copy; 2026 Rangpur Entrepreneurs Network</p>
    </footer>

</body>
</html>
