<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders Management - REN Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50">

<!-- Top Header -->
<header class="bg-white border-b sticky top-0 z-40">
    <div class="flex items-center justify-between h-16 px-4">
        <div class="flex items-center gap-4">
            <button onclick="document.getElementById('sidebar').classList.toggle('-translate-x-full')" class="lg:hidden p-2">
                <i class="fas fa-bars"></i>
            </button>
            <a href="index.html" class="flex items-center gap-3">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
                    <span class="text-white font-bold">REN</span>
                </div>
                <span class="font-bold hidden sm:block">Dashboard</span>
            </a>
        </div>
        <div class="flex items-center gap-4">
            <a href="../../index.html" class="text-sm text-gray-500 hover:text-blue-600"><i class="fas fa-globe mr-1"></i> View Site</a>
            <a href="#" class="p-2 text-gray-500 hover:text-blue-600 relative">
                <i class="fas fa-bell"></i>
                <span class="absolute -top-1 -right-1 w-2 h-2 bg-red-500 rounded-full"></span>
            </a>
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center">
                    <i class="fas fa-user text-blue-600 text-sm"></i>
                </div>
                <span class="hidden sm:block text-sm font-medium">Vendor</span>
            </div>
        </div>
    </div>
</header>

<div class="flex min-h-screen">
    <!-- Sidebar -->
    <aside id="sidebar" class="w-64 bg-white border-r min-h-screen fixed lg:relative z-30 -translate-x-full lg:translate-x-0 transition-transform">
        <nav class="p-4 space-y-1">
            <div class="text-xs text-gray-400 font-semibold uppercase tracking-wider mb-2 mt-4">Main</div>
            <a href="index.html" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-lg"><i class="fas fa-home w-5"></i> Dashboard</a>
            <a href="orders.html" class="flex items-center gap-3 px-4 py-3 bg-blue-50 text-blue-600 rounded-lg font-medium"><i class="fas fa-shopping-bag w-5"></i> Orders</a>
            <div class="text-xs text-gray-400 font-semibold uppercase tracking-wider mb-2 mt-6">Quick Links</div>
            <a href="../../vendor-store.html" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-lg"><i class="fas fa-eye w-5"></i> View Store</a>
            <a href="index.html" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-lg"><i class="fas fa-sign-out-alt w-5"></i> Logout</a>
        </nav>
    </aside>

    <!-- Overlay for mobile -->
    <div id="sidebar-overlay" onclick="document.getElementById('sidebar').classList.add('-translate-x-full')" class="fixed inset-0 bg-black/50 z-20 hidden lg:hidden"></div>

    <!-- Main Content -->
    <main class="flex-1 p-6">
        <h2 class="text-2xl font-bold mb-6">Orders Management</h2>
        <div class="bg-white rounded-xl border shadow-sm overflow-hidden">
            <table class="w-full">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Order</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Product</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Customer</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Amount</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Action</th>
                    </tr>
                </thead>
                <tbody class="divide-y">
                    <tr>
                        <td class="px-6 py-4 text-sm">#REN-001</td>
                        <td class="px-6 py-4 text-sm">Premium Website</td>
                        <td class="px-6 py-4 text-sm">Ahmed Hasan</td>
                        <td class="px-6 py-4 font-medium">?15,000</td>
                        <td class="px-6 py-4"><span class="px-2 py-1 bg-green-100 text-green-700 text-xs rounded-full">Completed</span></td>
                        <td class="px-6 py-4"><button class="text-blue-600">View</button></td>
                    </tr>
                    <tr>
                        <td class="px-6 py-4 text-sm">#REN-002</td>
                        <td class="px-6 py-4 text-sm">Mobile App</td>
                        <td class="px-6 py-4 text-sm">Sarah Rahman</td>
                        <td class="px-6 py-4 font-medium">?25,000</td>
                        <td class="px-6 py-4"><span class="px-2 py-1 bg-yellow-100 text-yellow-700 text-xs rounded-full">Pending</span></td>
                        <td class="px-6 py-4"><button class="text-green-600 mr-2">Accept</button><button class="text-red-600">Reject</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

<footer class="border-t py-4 text-center text-sm text-gray-500">
    &copy; 2026 Rangpur Entrepreneurs Network
</footer>

</body>
</html>
